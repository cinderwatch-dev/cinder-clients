# Runs on tags pushed to the monorepo only. Mirrors packages/* to cinderwatch-dev/cinder-{php,laravel,wordpress}. Packagist picks up new tags from the split repos.
name: Split Packages

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - cinder-php
          - cinder-laravel
          - cinder-wordpress
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Split ${{ matrix.package }}
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'cinderwatch-dev'
          repository_name: '${{ matrix.package }}'
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          tag: ${{ github.ref_name }}

  release:
    name: GitHub Release
    needs: split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build release notes from CHANGELOG
        id: notes
        working-directory: packages/cinder-laravel
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          : > "$NOTES_FILE"

          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { capture=1; next }
              /^## \[/ && capture { exit }
              capture { print }
            ' CHANGELOG.md >> "$NOTES_FILE"
          fi

          if [ -s "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "from_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "from_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.notes.outputs.from_changelog == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}

      - name: Publish GitHub Release
        if: steps.notes.outputs.from_changelog != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
