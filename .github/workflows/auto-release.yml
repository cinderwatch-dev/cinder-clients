# Tags are created only on the cinder-clients monorepo. Split Packages runs on tag push (split.yml).
name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic bump applied to the latest tag
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Exact tag to create (overrides bump when set), e.g. 1.1.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        if: matrix.php != '8.4'
        run: vendor/bin/pest

      - name: Run tests with coverage
        if: matrix.php == '8.4'
        run: vendor/bin/pest --coverage --min=100

  tag:
    name: Tag release
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Tags pushed with the default GITHUB_TOKEN do not trigger other workflows,
          # so a PAT is required for Split Packages and Release WordPress plugin to run.
          token: ${{ secrets.ACCESS_TOKEN || github.token }}

      - name: Resolve next version
        id: version
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
          EXACT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          if [ -n "$EXACT" ]; then
            NEXT="$EXACT"
          else
            LATEST=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            LATEST=${LATEST#v}

            if [ -z "$LATEST" ]; then
              LATEST="0.0.0"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "Tag ${NEXT} already exists."
            exit 1
          fi

          # Each adapter pins cinder-php with a caret constraint. On 0.x a caret only
          # spans one minor version, so refuse to tag a release the adapters cannot install.
          for manifest in packages/*/composer.json; do
            CONSTRAINT=$(php -r '$c = json_decode(file_get_contents($argv[1]), true); echo $c["require"]["cinderwatch/cinder-php"] ?? "";' "$manifest")
            if [ -z "$CONSTRAINT" ]; then
              continue
            fi
            if ! php -r '
              [$constraint, $version] = [ltrim($argv[1], "^"), $argv[2]];
              [$cMajor, $cMinor] = array_map("intval", array_pad(explode(".", $constraint), 2, "0"));
              [$vMajor, $vMinor] = array_map("intval", explode(".", $version));
              $ok = $cMajor === 0 ? ($vMajor === 0 && $vMinor === $cMinor) : $vMajor === $cMajor;
              exit($ok && version_compare($version, $constraint, ">=") ? 0 : 1);
            ' "$CONSTRAINT" "$NEXT"; then
              echo "${manifest} requires cinderwatch/cinder-php ${CONSTRAINT}, which does not allow ${NEXT}."
              exit 1
            fi
          done

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${NEXT}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"